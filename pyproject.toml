[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-mcp"
version = "0.1.0"
description = "Turn a personal Obsidian / Markdown knowledge base into a read-only, permission-scoped MCP service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
wiki-mcp = "wiki_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["wiki_mcp*"]

[tool.setuptools.package-data]
wiki_mcp = ["admin_page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
